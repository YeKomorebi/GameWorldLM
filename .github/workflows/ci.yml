name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: gameworldlm-real --help
      - run: gameworldlm-dataset --help
      - run: ruff check .
      - run: pytest -q
      - run: gameworldlm examples --provider fixture --output-dir outputs/ci
      - uses: actions/upload-artifact@v4
        with:
          name: example-maps-python-${{ matrix.python-version }}
          path: outputs/ci/
