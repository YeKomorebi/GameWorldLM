[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gameworldlm"
version = "0.4.1"
description = "Natural language to validated spatial tokens and 2D world maps"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "openai>=1.54,<3",
  "pydantic>=2.9,<3",
  "pygame>=2.6.1,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pillow>=10,<13"]
training = [
  "torch==2.6.0", "transformers==4.57.6", "peft==0.15.2", "accelerate==1.6.0",
  "bitsandbytes==0.45.5; platform_system == 'Linux'",
]

[project.scripts]
gameworldlm = "gameworldlm.cli:main"
gameworldlm-real = "examples.real_generation:main"
gameworldlm-dataset = "dataset.export:main"
gameworldlm-build-dataset = "dataset_generation.dataset_builder:main"
gameworldlm-prompts = "dataset_generation.prompt_generator:main"
gameworldlm-split-dataset = "dataset_generation.splits:main"
gameworldlm-dataset-stats = "dataset_generation.statistics:main"
gameworldlm-prepare-training = "training.prepare_dataset:main"
gameworldlm-train-lora = "training.train_lora:main"
gameworldlm-infer-lora = "training.infer_lora:main"
gameworldlm-evaluate-lora = "training.evaluate_lora:main"
gameworldlm-spatial-analysis = "evaluation.spatial:main"
gameworldlm-spatial-benchmark = "evaluation.benchmark:main"
gameworldlm-spatial-curriculum = "dataset_generation.spatial_curriculum:main"
gameworldlm-spatial-stats = "evaluation.dataset_statistics:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gameworldlm*", "llm*", "world*", "engine*", "assets*", "examples*", "dataset*", "training*", "evaluation*"]
exclude = ["dataset.artifacts*"]

[tool.setuptools.package-data]
examples = ["prompts.json", "real_prompts.json"]
assets = ["placeholder/*.png", "placeholder/*.md"]
training = ["configs/*.json", "configs/*.txt"]
evaluation = ["prompts.jsonl", "prompts.manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
